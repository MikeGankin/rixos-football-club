<section class="request coral">
    <h2 class="request__title">Оставить заявку</h2>
    <p class="request__text">Подберите тур в отель Rixos с участием в Rixos Football Academy.</p>

    <form class="request__form">
        <label class="request__field">
            <span class="request__label">Имя</span>
            <input class="request__input" type="text" name="name" autocomplete="name">
        </label>

        <label class="request__field">
            <span class="request__label">Телефон</span>
            <input class="request__input" type="tel" name="phone" autocomplete="tel">
        </label>

        <label class="request__field">
            <span class="request__label">Отель</span>
            <select class="request__input" name="hotel">
                <option>Rixos Premium Belek</option>
                <option>Rixos Premium Tekirova</option>
                <option>Rixos Sungate</option>
                <option>Rixos Downtown Antalya</option>
                <option>Rixos Park Belek</option>
            </select>
        </label>

        <button class="request__button" type="submit">Выбрать тур</button>
    </form>
</section>
